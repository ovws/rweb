[package]
name = "rweb-wasm"
version = "0.1.0"
edition = "2021"
description = "CPU-heavy particle simulation for the RWEB browser benchmark"
license = "MIT"

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "0.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[package.metadata.wasm-pack.profile.release]
wasm-opt = false
